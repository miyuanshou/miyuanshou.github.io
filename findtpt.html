    var themeToggle = document.getElementById('themeToggle');

    themeToggle.addEventListener('click', function() {
      var body = document.body;
      if (body.className.indexOf('dark') !== -1) {
        body.className = body.className.replace(/\bdark\b/g, '').replace(/\s+/g, ' ').trim();
        themeToggle.textContent = '切换深色模式';
      } else {
        body.className += ' dark';
        themeToggle.textContent = '切换浅色模式';
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.className = 'error-msg show';
      resultArea.innerHTML = '';
    }
    function clearError() {
      errorMsg.className = 'error-msg';
      errorMsg.textContent = '';
    }
    function renderEmpty() {
      resultArea.innerHTML = '<div class="empty-state"><div class="icon"></div><p>输入元素符号、名称或原子序数开始查询</p></div>';
    }

    function renderElement(el) {
      var radioTag = el.radioactive
        ? '<span class="tag tag-yes"><span class="tag-dot"></span>是</span>'
        : '<span class="tag tag-no"><span class="tag-dot"></span>否</span>';
      var synthTag = el.synthetic
        ? '<span class="tag tag-yes"><span class="tag-dot"></span>是</span>'
        : '<span class="tag tag-no"><span class="tag-dot"></span>否</span>';

      resultArea.innerHTML = '<div class="card">' +
        '<div class="card-header">' +
          '<div class="symbol-badge">' + el.symbol + '</div>' +
          '<div class="card-title">' +
            '<div class="zh-name">' + el.nameZh + '</div>' +
            '<div class="en-name">' + el.nameEn + '</div>' +
            '<div class="atomic-number">原子序数 ' + el.number + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="props-grid">' +
          '<div class="prop-item"><div class="prop-label">元素符号</div><div class="prop-value mono">' + el.symbol + '</div></div>' +
          '<div class="prop-item"><div class="prop-label">相对原子质量</div><div class="prop-value mono">' + el.mass + '</div></div>' +
          '<div class="prop-item full-width"><div class="prop-label">常见化合价</div><div class="prop-value">' + el.valence + '</div></div>' +
          '<div class="prop-item"><div class="prop-label">放射性</div><div class="prop-value">' + radioTag + '</div></div>' +
          '<div class="prop-item"><div class="prop-label">人造元素</div><div class="prop-value">' + synthTag + '</div></div>' +
        '</div>' +
      '</div>';
    }

    function search(query) {
      var q = query.trim().toLowerCase();
      if (!q) { clearError(); renderEmpty(); return; }

      var results = [];
      for (var i = 0; i < SEARCH_INDEX.length; i++) {
        var item = SEARCH_INDEX[i];
        for (var k = 0; k < item.keys.length; k++) {
          if (item.keys[k].indexOf(q) !== -1) { results.push(item.element); break; }
        }
      }

      if (results.length === 0) {
        showError('未找到与 “' + query.trim() + '” 匹配的元素，请检查符号或名称。');
        return;
      }
      clearError();

      var exact = null;
      for (var m = 0; m < results.length; m++) {
        var el = results[m];
        if (el.symbol.toLowerCase() === q || el.nameZh === query.trim() ||
            el.nameEn.toLowerCase() === q || String(el.number) === q) {
          exact = el; break;
        }
      }
      renderElement(exact || results[0]);

      if (results.length > 1 && !exact) {
        var card = resultArea.querySelector('.card');
        var listHtml = '<div class="quick-list"><div class="label">多个匹配结果：</div>';
        var limit = Math.min(results.length, 8);
        for (var n = 0; n < limit; n++) {
          listHtml += '<button class="quick-item" data-symbol="' + results[n].symbol + '">' +
            results[n].symbol + ' · ' + results[n].nameZh + '</button>';
        }
        listHtml += '</div>';
        card.insertAdjacentHTML('beforeend', listHtml);

        var quickBtns = card.querySelectorAll('.quick-item');
        for (var p = 0; p < quickBtns.length; p++) {
          quickBtns[p].addEventListener('click', function() {
            var sym = this.getAttribute('data-symbol');
            for (var t = 0; t < ELEMENTS.length; t++) {
              if (ELEMENTS[t].symbol === sym) { renderElement(ELEMENTS[t]); break; }
            }
            input.value = sym;
          });
        }
      }
    }

    var timer;
    input.addEventListener('input', function() {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function() { search(input.value); }, 200);
    });

    renderEmpty();
    input.focus();
  </script>
</body>
</html>
